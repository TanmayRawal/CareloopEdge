{% extends "portal/base.html" %}
{% block title %}Upload a scan{% endblock %}
{% block pcontent %}
<div class="page-head narrow-card"><div><a class="small" href="{{ url_for('patient.dashboard') }}">← My reports</a><h1>Upload a scan</h1>
  <p>A radiologist will review it and release a signed report to this portal.</p></div></div>
<section class="card narrow-card">
    <div class="card-b">
      <div class="steps" aria-hidden="true"><span class="on" id="st1"><b>1</b>Choose image</span><span id="st2"><b>2</b>Add details</span><span id="st3"><b>3</b>Submit</span></div>
      {% if error %}<div class="alert error" role="alert"><svg class="ic sm"><use href="#i-alert"/></svg><span>{{ error }}</span></div>{% endif %}
      <form method="post" enctype="multipart/form-data" class="form" id="upload-form">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <label class="dropzone" id="dropzone">
          <svg class="ic"><use href="#i-upload"/></svg>
          <span class="dz-title">Drag your scan here or browse</span>
          <span class="muted small">PNG, JPG or DICOM · up to 20 MB · one image</span>
          <span class="dz-file" id="dz-file"></span>
          <input type="file" name="scan" id="scan" accept=".png,.jpg,.jpeg,.bmp,.tif,.tiff,.dcm,.dicom" required>
        </label>
        <label class="field">Note for the radiologist <span class="hint">Optional — symptoms or reason for the scan</span>
          <textarea name="note" rows="3" maxlength="1000"></textarea></label>
        <label class="check"><input type="checkbox" name="consent" value="yes" required>
          <span>I consent to this image being stored securely at the clinic and reviewed by clinic doctors.</span></label>
        <button class="btn primary lg block" id="submit" type="submit">Submit for review</button>
      </form>
    </div>
  </section>

{% endblock %}
