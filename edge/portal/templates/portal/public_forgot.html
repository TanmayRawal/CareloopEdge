{% extends "portal/base.html" %}
{% block title %}Forgot password{% endblock %}
{% block bare %}
<div class="auth">
  {% include "portal/_auth_head.html" %}
  <section class="auth-main">
    <div class="auth-box">
      <h2>Forgot password</h2>
      {% if error %}<div class="alert error" role="alert"><svg class="ic sm"><use href="#i-alert"/></svg><span>{{ error }}</span></div>{% endif %}
      <form method="post" class="form">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <label class="field">E-mail address<input type="email" name="email" required autofocus autocomplete="username"></label>
        <button class="btn primary lg block" type="submit">Send reset link</button>
      </form>
      <div class="auth-alt"><a href="{{ url_for('auth.login') }}">Back to sign in</a></div>
    </div>
  </section>
  <footer class="auth-foot">Authorised use only. Access to this system is recorded.</footer>
</div>
{% endblock %}
