<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ doc.exam }} report · {{ doc.patient }} · {{ doc.accession }}-{{ doc.version }}</title>
<style>
  @page { size: A4; margin: 16mm 14mm; }
  body { font: 13.5px/1.55 "IBM Plex Sans", "Segoe UI", system-ui, Roboto, Arial, sans-serif; color: #15181c; background: #eef0f2; margin: 0; }
  .doc { max-width: 800px; margin: 28px auto; background: #fff; padding: 40px 48px; border: 1px solid #dfe2e6; }
  .doc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 14px; border-bottom: 2px solid #15181c; }
  .doc-head .org b { font-size: 16px; display: block; letter-spacing: .02em; text-transform: uppercase; }
  .doc-head small { display: block; color: #687079; font-size: 12px; }
  .doc-head .title { text-align: right; } .doc-head .title b { display: block; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
  .doc-status { display: inline-block; margin-top: 6px; padding: 2px 8px; border: 1px solid #1f6b3a; color: #1f6b3a; font-size: 11px;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .doc-status.amended { border-color: #9a5800; color: #9a5800; }
  .doc-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 18px; padding: 14px 0; border-bottom: 1px solid #dfe2e6; }
  .doc-meta span { display: block; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #687079; }
  .doc-meta b { font-size: 13px; font-weight: 500; }
  .doc-sec { padding: 12px 0; border-bottom: 1px solid #dfe2e6; }
  .doc-sec h3 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #3c434b; }
  .doc-imp .dx { font-size: 18px; font-weight: 600; } .doc-imp .pre { margin-top: 4px; }
  .pre { white-space: pre-wrap; }
  .doc-sign { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding-top: 20px; }
  .doc-sign .sig b { display: block; font-size: 15px; } .doc-sign small { display: block; color: #687079; font-size: 12px; }
  .doc-sign .ver { text-align: right; color: #687079; font-size: 11px; }
  .doc-amend { background: #fbf0dc; border-left: 3px solid #9a5800; padding: 8px 12px; margin: 14px 0 0; }
  .doc-foot { margin-top: 18px; padding-top: 10px; border-top: 1px solid #dfe2e6; color: #687079; font-size: 11px; }
  .doc-foot p { margin: 0 0 4px; }
  @media print { body { background: #fff; } .doc { margin: 0; border: 0; padding: 0; max-width: none; } }
</style></head>
<body>
{% include "portal/_report_doc.html" %}
</body></html>
