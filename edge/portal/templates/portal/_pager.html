{% if page > 1 or more %}
<div class="pager">
  {% set args = request.args.to_dict() %}
  {% if page > 1 %}{% set _ = args.update({'page': page - 1}) %}<a class="btn sm" href="?{{ args|urlencode }}"><svg class="ic sm"><use href="#i-back"/></svg>Newer</a>{% endif %}
  <span class="small muted">Page {{ page }}</span>
  {% if more %}{% set _ = args.update({'page': page + 1}) %}<a class="btn sm" href="?{{ args|urlencode }}">Older<svg class="ic sm flip"><use href="#i-back"/></svg></a>{% endif %}
</div>
{% endif %}
