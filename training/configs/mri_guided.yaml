# 2D MRI tumor classification + segmentation (BRISC 2025 primary; figshare / Nickparvar v2 external)
name: mri
class_names: [glioma, meningioma, no_tumor, pituitary]
manifest: data/manifests/mri.csv
output_dir: runs/mri
conformal_alpha: 0.05

preprocess:
  image_size: 224
  brain_crop: true
  clahe: false          # ablation: set true

model:
  backbone: resnet50
  output_stride: 16     # ablation: 32
  pretrained: true
  dropout: 0.3
  segmentation: true
  fpn_channels: 128

train:
  epochs: 40
  batch_size: 16        # RTX 4050 6 GB with AMP
  lr_head: 1.0e-3
  lr_backbone: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 2
  ema_decay: 0.999
  seg_loss_weight: 1.0
  guidance_loss_weight: 1.0   # ABLATION: energy-in-mask loss (Rao et al. ICCV 2023)
  early_stop_patience: 8
  amp: true
  num_workers: 4
  seeds: [0, 1, 2]
