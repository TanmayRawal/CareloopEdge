# v2 (Phase 2 of the patient-level plan): the v1 model and recipe, retrained with slices from 3D patient studies added
# (BraTS-GLI, BraTS-MEN, NHNN pituitary; three planes; tumour and tumour-free slices of the same scans).
# Why: on whole studies v1 missed all three pre-registered targets (docs/FINDINGS.md section 11): it had only seen
# loose 2D slices with the skull and was out of its depth on skull-stripped and wide field-of-view volumes.
# Only the data changes; architecture, preprocessing (same fingerprint) and training settings are v1's, so the
# comparison isolates the effect of training on real patient studies.
#   python -m training.train --config training/configs/mri_v2vol.yaml --seed 0 --tag _v2vol
name: mri
class_names: [glioma, meningioma, no_tumor, pituitary]
manifest: data/manifests/mri_v3.csv     # mri_v2.csv + volume slices of train / val / cal patients (never test)
output_dir: runs/mri
conformal_alpha: 0.05

preprocess:
  image_size: 224
  brain_crop: true
  clahe: false

model:
  backbone: resnet50
  output_stride: 8
  pretrained: true
  dropout: 0.3
  segmentation: true
  fpn_channels: 128
  pooling: lesion
  attn_eps: 0.005
  seg_aux_weight: 0.4

train:
  epochs: 40
  batch_size: 16
  lr_head: 1.0e-3
  lr_backbone: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 2
  ema_decay: 0.999
  seg_loss_weight: 1.0
  seg_focal_gamma: 2.0
  guidance_loss_weight: 0.0
  early_stop_patience: 8
  amp: true
  num_workers: 4
  seeds: [0, 1, 2]
